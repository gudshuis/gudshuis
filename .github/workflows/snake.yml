name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gudshuis
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%232d3343,%230e4429,%23006d32,%2326a641,%2339d353
            dist/snake-light.svg?color_snake=%237C3AED&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
